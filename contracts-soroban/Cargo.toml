[workspace]
resolver = "2"
members = [
    "membership-nft",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.79"

[workspace.dependencies]
soroban-sdk = { version = "21.2.0", default-features = false }
soroban-sdk = { version = "21.2.0", features = ["testutils"], default-features = false, optional = true }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
